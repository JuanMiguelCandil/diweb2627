<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modelo fijo</title>
        <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e5e7eb;
}
.contenedor {
    width: 1000px;
    margin: auto;
    background: white;
    min-height: 100vh;
}
header {
    background: #2563eb;
    color: white;
    padding: 30px;
    text-align: center;
}
nav {
    background: #1e40af;
    padding: 15px;
    color: white;
    text-align: center;
}
main {
    display: flex;
    padding: 20px;
    gap: 20px;
}
section {
    width: 650px;
    padding: 20px;
    background: #dbeafe;
}
aside {
    width: 250px;
    padding: 20px;
    background: #bfdbfe;
}
footer {
    background: #2563eb;
    color: white;
    padding: 20px;
    text-align: center;
}
</style>
    </head>
    <body>
        <div class="contenedor">
            <header>
                <h1>Mi página tecnológica</h1>
                <p>Modelo de diseño fijo</p>
            </header>
            <nav>Inicio | Servicios | Contacto</nav>
            <main>
                <section>
                    <h2>Bienvenido</h2>
                    <p>Esta página utiliza un modelo fijo. Su anchura
                        siempre es de 1000 píxeles, independientemente
                        del tamaño de la pantalla.</p>
                </section>
                <aside>
                    <h3>Información</h3>
                    <p>El diseño mantiene sus dimensiones.</p>
                </aside>
            </main>
            <footer>© 2026 - Mi página web</footer>
        </div>
    </body>
</html>
